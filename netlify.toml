# Netlify configuration file
# Clean deploy v2

[build]
  # No build command needed for static site
  publish = "."
  
[functions]
  # Directory for serverless functions
  directory = "netlify/functions"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Function responses: [[headers]] rules here never apply to them (Netlify
# only applies custom headers to static files), so each function sets its
# own caching headers. Public read endpoints are CDN-cached and purged on
# admin writes -- see netlify/lib/cdn-cache.js. Everything else, including
# get-tracking-data's privacy-sensitive gating, helpout-status and
# admin-qr-signs, sends Cache-Control: no-store or a short CDN max-age
# from the function itself.

# helpout.santasleighsalford.co.uk -- the volunteer registration page.
# The subdomain is a domain alias on this same site: its root serves
# helpout.html (plus the stylesheet it uses), and every other path
# redirects to the same path on the main domain so the subdomain never
# becomes a second copy of the site. helpout.html calls its functions on
# the main domain directly (CORS in netlify/lib/helpout-cors.js).
[[redirects]]
  from = "https://helpout.santasleighsalford.co.uk/"
  to = "/helpout.html"
  status = 200
  force = true

[[redirects]]
  from = "https://helpout.santasleighsalford.co.uk/styles.css"
  to = "/styles.css"
  status = 200
  force = true

[[redirects]]
  from = "https://helpout.santasleighsalford.co.uk/privacy-prefs.js"
  to = "/privacy-prefs.js"
  status = 200
  force = true

[[redirects]]
  from = "https://helpout.santasleighsalford.co.uk/*"
  to = "https://santasleighsalford.co.uk/:splat"
  status = 301
  force = true

# QR street signs: each printed sign's QR encodes /s/<number> (001-045).
# Rewrite (200, URL unchanged) to qr.html, which records one anonymous
# visit only if the visitor's analytics preference allows it, then sends
# them to the homepage. Never cached, so every scan runs that check.
# Kept after the helpout.* rules so that subdomain still forwards here.
[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/qr.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/s"
  to = "/"
  status = 302

[[redirects]]
  from = "/s/*"
  to = "/qr.html"
  status = 200

# Redirects (if needed)
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301

# Custom 404 page (optional - create this file if you want)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404