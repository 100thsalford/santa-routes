<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See every night of Santa's Super Sleigh tour around Salford on one map. 100th Salford Scout Group Christmas fundraiser.">
    <title>Santa's Routes Map | Santa Super Sleigh Salford</title>
    <link rel="stylesheet" href="styles.css?v=20261029a">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { background: var(--snow); }

        .routes-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.25rem 1rem 2rem;
        }

        .routes-header { text-align: center; margin-bottom: 1rem; }
        .routes-header h1 { color: var(--santa-red); font-size: 1.6rem; margin: 0 0 0.25rem; }
        .routes-header p { color: var(--ink-soft); margin: 0; }

        /* Night picker: one scrollable row of chips on phones, wraps on desktop. */
        .night-picker {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 0.25rem 0 0.75rem;
            margin: 0 -1rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .night-picker::-webkit-scrollbar { display: none; }
        @media (min-width: 700px) {
            .night-picker { flex-wrap: wrap; overflow: visible; margin: 0; padding-left: 0; padding-right: 0; }
        }

        .night-chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
            font: inherit;
            font-size: 0.88rem;
            color: var(--text-dark);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .night-chip .dot {
            width: 0.7rem; height: 0.7rem; border-radius: 50%;
            flex-shrink: 0;
        }
        .night-chip.past { color: var(--ink-soft); }
        .night-chip.past .dot { background: #9aa0a8 !important; }
        .night-chip .tag {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
            color: var(--santa-red);
        }
        .night-chip[aria-pressed="true"] {
            background: var(--santa-green);
            border-color: var(--santa-green);
            color: #fff;
        }
        .night-chip[aria-pressed="true"] .tag { color: #ffe9a8; }
        .night-chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px #fff; }

        #routesMap {
            width: 100%;
            height: 60vh;
            min-height: 360px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            background: var(--surface-muted);
        }

        .night-detail {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 0.85rem 1.1rem;
            margin-top: 0.75rem;
            line-height: 1.5;
        }
        .night-detail strong { color: var(--santa-green); }
        .night-detail .muted { color: var(--ink-soft); font-size: 0.9rem; }

        .routes-empty {
            text-align: center;
            color: var(--ink-soft);
            padding: 2rem 1rem;
        }

        .route-popup { font-size: 0.95rem; line-height: 1.4; }
        .route-popup strong { color: var(--santa-green); }

        .routes-back { text-align: center; margin-top: 1.5rem; }

        @media (max-width: 480px) {
            .routes-header h1 { font-size: 1.35rem; }
            #routesMap { height: 52vh; }
        }
    </style>
    <!-- Analytics preferences: must load before any analytics -->
    <script src="privacy-prefs.js?v=20261024a"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main class="routes-container" id="main" tabindex="-1">
        <div class="routes-header">
            <h1><span aria-hidden="true">🗺️</span> Santa's Routes</h1>
            <p id="routesIntro">Every night of Santa's tour around Salford.</p>
        </div>

        <div class="night-picker" id="nightPicker" role="group" aria-label="Choose a night"></div>

        <div id="routesMap" role="region" aria-label="Map of Santa's routes"></div>

        <div class="night-detail" id="nightDetail">Loading routes&hellip;</div>

        <div class="routes-back">
            <a href="index.html" class="back-btn">Return to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p><span aria-hidden="true">🎄</span> Supporting <a href="https://www.facebook.com/100thsalford" target="_blank" rel="noopener noreferrer" class="footer-link">100th Salford Scout Group</a> <span aria-hidden="true">🎄</span></p>
        <p>Donations help fund Scouting activities for young people in Salford</p>
        <p class="footer-note"><a href="privacy.html" class="footer-link">Privacy Policy</a> · <button type="button" data-analytics-prefs class="footer-link link-button">Analytics preferences</button></p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="analytics.js"></script>
    <script>
        // Public "Interactive Map": every night of the current season drawn
        // from its uploaded GPX (get-public-routes.js -- line, route name
        // and date only; turn-by-turn directions stay volunteer-only).
        // Upcoming nights get their own colour, nights that have already
        // run are greyed out, and a chip row picks one night to highlight.
        (function() {
            'use strict';

            // Distinct, saturated colours that stay readable on OSM tiles.
            var COLOURS = ['#C62828', '#1565C0', '#2E7D32', '#6A1B9A', '#EF6C00', '#00838F',
                           '#AD1457', '#4E342E', '#283593', '#9E9D24', '#D84315', '#00695C'];
            var PAST_COLOUR = '#8a8f98';

            var pickerEl = document.getElementById('nightPicker');
            var detailEl = document.getElementById('nightDetail');
            var introEl = document.getElementById('routesIntro');

            var map = L.map('routesMap', { scrollWheelZoom: false, tap: true }).setView([53.49, -2.30], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            // Scroll-zoom only once the map has been clicked, so scrolling
            // the page on desktop doesn't get hijacked by the map.
            map.once('click', function() { map.scrollWheelZoom.enable(); });

            var nights = [];
            var selectedId = null;
            var today = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });

            function escapeHtml(str) {
                var div = document.createElement('div');
                div.textContent = str == null ? '' : String(str);
                return div.innerHTML;
            }

            function formatNight(iso, long) {
                return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', long
                    ? { weekday: 'long', day: 'numeric', month: 'long' }
                    : { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
            }

            function styleFor(n, state) {
                // state: 'normal' (All view), 'selected', 'faded'
                var colour = n.past ? PAST_COLOUR : n.colour;
                if (state === 'selected') return { color: colour, weight: 7, opacity: 1, dashArray: null };
                if (state === 'faded') return { color: colour, weight: 3, opacity: 0.18, dashArray: n.past ? '4 8' : null };
                return { color: colour, weight: 4, opacity: n.past ? 0.55 : 0.85, dashArray: n.past ? '4 8' : null };
            }

            function render() {
                nights.forEach(function(n) {
                    var state = selectedId == null ? 'normal' : (n.id === selectedId ? 'selected' : 'faded');
                    n.layer.setStyle(styleFor(n, state));
                    if (state === 'selected') n.layer.bringToFront();
                });
                // Upcoming nights drawn above greyed past ones in the All view.
                if (selectedId == null) nights.forEach(function(n) { if (!n.past) n.layer.bringToFront(); });

                Array.prototype.forEach.call(pickerEl.children, function(chip) {
                    var id = chip.dataset.id ? parseInt(chip.dataset.id, 10) : null;
                    chip.setAttribute('aria-pressed', String(id === selectedId));
                });

                if (selectedId == null) {
                    var upcoming = nights.filter(function(n) { return !n.past; }).length;
                    detailEl.innerHTML = '<strong>' + nights.length + ' night' + (nights.length === 1 ? '' : 's') + '</strong> on the map' +
                        (upcoming < nights.length ? ' — ' + upcoming + ' still to come, past nights greyed out' : '') +
                        '.<br><span class="muted">Tap a line or pick a night above to highlight it. Want exact times? <a href="index.html">Search for your street</a>.</span>';
                } else {
                    var n = nights.filter(function(x) { return x.id === selectedId; })[0];
                    detailEl.innerHTML = '<strong>' + escapeHtml(n.route) + '</strong> — ' + escapeHtml(formatNight(n.date, true)) +
                        (n.date === today ? ' <strong style="color:var(--santa-red)">(tonight!)</strong>' : '') +
                        (n.past ? ' <span class="muted">(already visited)</span>' : '') +
                        (n.distanceKm ? '<br><span class="muted">About ' + n.distanceKm + ' km. ' : '<br><span class="muted">') +
                        'Want exact times? <a href="index.html">Search for your street</a>.</span>';
                }
            }

            function select(id, fit) {
                selectedId = id;
                render();
                if (!fit) return;
                var bounds = id == null
                    ? L.featureGroup(nights.map(function(n) { return n.layer; })).getBounds()
                    : nights.filter(function(n) { return n.id === id; })[0].layer.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [24, 24] });
            }

            function addChip(label, id, n) {
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'night-chip' + (n && n.past ? ' past' : '');
                if (id != null) chip.dataset.id = id;
                if (n) {
                    var dot = document.createElement('span');
                    dot.className = 'dot';
                    dot.style.background = n.colour;
                    chip.appendChild(dot);
                }
                chip.appendChild(document.createTextNode(label));
                if (n && (n.date === today || n.isNext)) {
                    var tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = n.date === today ? 'Tonight' : 'Next';
                    chip.appendChild(tag);
                }
                if (n && n.past) chip.appendChild(document.createTextNode(' ✓'));
                chip.onclick = function() { select(selectedId === id ? null : id, true); };
                pickerEl.appendChild(chip);
                return chip;
            }

            async function load() {
                try {
                    var res = await fetch('/.netlify/functions/get-public-routes');
                    var data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Could not load routes');
                    nights = data.nights || [];
                } catch (err) {
                    console.error('Error loading routes:', err);
                    detailEl.innerHTML = '<div class="routes-empty">Sorry, the route map couldn’t be loaded just now. Please try again in a moment.</div>';
                    return;
                }

                if (nights.length === 0) {
                    pickerEl.hidden = true;
                    detailEl.innerHTML = '<div class="routes-empty">🎄 This year’s route maps are coming soon — check back closer to December.</div>';
                    return;
                }

                var season = nights[0].date.slice(0, 4);
                introEl.textContent = 'Every night of Santa’s ' + season + ' tour around Salford.';

                var colourIdx = 0, nextFound = false;
                nights.forEach(function(n) {
                    n.past = n.date < today;
                    n.colour = COLOURS[colourIdx++ % COLOURS.length];
                    if (!n.past && n.date !== today && !nextFound && !nights.some(function(x) { return x.date === today; })) {
                        n.isNext = true;
                        nextFound = true;
                    }
                    n.layer = L.polyline(n.points, styleFor(n, 'normal')).addTo(map);
                    // Wider invisible line underneath makes thin routes easy to tap on a phone.
                    n.hit = L.polyline(n.points, { color: '#000', opacity: 0, weight: 18 }).addTo(map);
                    var popupHtml = '<div class="route-popup"><strong>' + escapeHtml(n.route) + '</strong><br>' +
                        escapeHtml(formatNight(n.date, true)) + (n.past ? '<br><em>Already visited</em>' : '') + '</div>';
                    [n.layer, n.hit].forEach(function(l) {
                        l.bindPopup(popupHtml);
                        l.on('click', function() { select(n.id, false); });
                    });
                });

                addChip('All nights', null, null);
                nights.forEach(function(n) { addChip(formatNight(n.date, false) + ' · ' + n.route, n.id, n); });

                select(null, true);

                // Start scrolled to the next/tonight chip on phones.
                var tagEl = pickerEl.querySelector('.night-chip .tag');
                if (tagEl) {
                    var chipEl = tagEl.parentNode;
                    pickerEl.scrollLeft = Math.max(0, chipEl.offsetLeft - pickerEl.offsetLeft - (pickerEl.clientWidth - chipEl.offsetWidth) / 2);
                }
            }

            load();
        })();
    </script>
</body>
</html>
